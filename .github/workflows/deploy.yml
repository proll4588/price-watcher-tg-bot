name: CI/CD Pipeline

on:
  push:
    branches: [release]
    tags: ["v*.*.*"]
  pull_request:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add jump server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.JUMP_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy through jump server
        run: |
          ssh ${{ secrets.JUMP_SERVER_USER }}@${{ secrets.JUMP_SERVER_HOST }} << 'JUMP_COMMANDS'
            # Передаем команды на домашний сервер через VPN
            ssh -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                ${{ secrets.HOME_SERVER_USER }}@${{ secrets.HOME_SERVER_IP }} << 'HOME_COMMANDS'
                
                # Переходим в директорию проекта
                cd ${{ secrets.PROJECT_PATH }}
                
                # Создаем backup текущей версии
                BACKUP_DIR="/backups/$(date +%Y%m%d_%H%M%S)"
                mkdir -p $BACKUP_DIR
                cp -r . $BACKUP_DIR/
                
                # Останавливаем текущие контейнеры
                docker-compose down
                
                # Обновляем код
                if [[ "${{ github.ref }}" == refs/tags/* ]]; then
                  # Если это тег, переключаемся на него
                  git fetch origin --tags
                  git checkout ${{ github.ref_name }}
                else
                  # Если это release ветка
                  git pull origin release
                fi
                
                # Создаем .env файл с секретами
                cat > .env << 'ENV_CONTENT'
                NODE_ENV=production
                PORT=${{ secrets.PORT }}
                DATABASE_URL=${{ secrets.DATABASE_URL }}
                POSTGRES_DB=${{ secrets.POSTGRES_DB }}
                POSTGRES_USER=${{ secrets.POSTGRES_USER }}
                POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
                TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
                TELEGRAM_WEBHOOK_URL=${{ secrets.TELEGRAM_WEBHOOK_URL }}
                REDIS_URL=${{ secrets.REDIS_URL }}
                GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
                PROMETHEUS_PASSWORD=${{ secrets.PROMETHEUS_PASSWORD }}
                LOG_LEVEL=${{ secrets.LOG_LEVEL }}
                ENV_CONTENT
                
                # Пересобираем образы
                docker-compose build --no-cache
                
                # Применяем миграции БД
                docker-compose run --rm app npx prisma migrate deploy
                
                # Запускаем новые контейнеры
                docker-compose up -d
                
                # Ждем запуска
                sleep 15
                
                # Проверяем статус контейнеров
                docker-compose ps
                
                # Health check
                # if curl -f http://localhost:${{ secrets.PORT }}/health; then
                #     echo "✅ Health check passed!"
                #     # Удаляем старые backup'ы (оставляем последние 5)
                #     ls -dt /backups/* | tail -n +6 | xargs -r rm -rf
                # else
                #     echo "❌ Health check failed! Rolling back..."
                #     docker-compose down
                #     cp -r $BACKUP_DIR/* .
                #     docker-compose up -d
                #     exit 1
                # fi

                # Удаляем старые backup'ы (оставляем последние 5)
                ls -dt /backups/* | tail -n +6 | xargs -r rm -rf
                
                # Очищаем старые образы
                docker image prune -f
                
            HOME_COMMANDS
          JUMP_COMMANDS

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Деплой успешно завершен!"
            echo "Версия: ${{ github.sha }}"
            echo "Время: $(date)"
          else
            echo "❌ Деплой завершился с ошибкой!"
            echo "Версия: ${{ github.sha }}"
            echo "Время: $(date)"
          fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Деплой успешно завершен!"
            echo "Версия: ${{ github.sha }}"
            echo "Время: $(date)"
          else
            echo "❌ Деплой завершился с ошибкой!"
            echo "Версия: ${{ github.sha }}"
            echo "Время: $(date)"
          fi
