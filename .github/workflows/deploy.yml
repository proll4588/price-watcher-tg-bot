name: CI/CD Pipeline

on:
  push:
    tags: ["v*.*.*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup WireGuard VPN
        run: |
          echo "🔧 Настраиваем WireGuard VPN..."

          # Устанавливаем WireGuard с sudo
          sudo apt-get update && sudo apt-get install -y wireguard wireguard-tools

          # Создаем конфигурацию WireGuard
          sudo mkdir -p /etc/wireguard
          sudo tee /etc/wireguard/wg0.conf > /dev/null << 'EOF'
          ${{ secrets.WIREGUARD_CONFIG }}
          EOF

          # Устанавливаем правильные права
          sudo chmod 600 /etc/wireguard/wg0.conf

          # Запускаем VPN
          echo "🚀 Запускаем WireGuard VPN..."
          sudo wg-quick up wg0

          # Ждем установки соединения
          echo "⏳ Ждем установки VPN соединения..."
          sleep 10

          # Проверяем статус VPN
          echo "🔍 Проверяем статус WireGuard:"
          sudo wg show

          # Проверяем маршрутизацию
          echo "🔍 Проверяем маршрутизацию:"
          ip route show

      - name: Setup SSH for VPN
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test VPN connection
        run: |
          echo "🔍 Тестируем VPN подключение..."

          # Проверяем доступность home server через VPN
          echo "1️⃣ Проверяем доступность home server через VPN..."
          ping -c 3 ${{ secrets.HOME_SERVER_VPN_IP }} || {
            echo "❌ Не удалось подключиться к home server через VPN"
            echo "🔍 Проверьте:"
            echo "   - WireGuard конфигурацию в GitHub Secrets"
            echo "   - VPN IP адрес home server"
            echo "   - Статус WireGuard на home server"
            exit 1
          }

          echo "2️⃣ Тестируем SSH подключение через VPN..."
          ssh -T -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.HOME_SERVER_USER }}@${{ secrets.HOME_SERVER_VPN_IP }} "echo '✅ SSH подключение через VPN работает'" || {
            echo "❌ Не удалось подключиться по SSH через VPN"
            echo "🔍 Проверьте SSH ключи и настройки"
            exit 1
          }

          echo "✅ VPN подключение работает!"

      - name: Deploy to home server
        run: |
          echo "🚀 Подключаемся к домашнему серверу через VPN и запускаем деплой..."

          # Подключаемся к домашнему серверу через VPN и запускаем скрипт деплоя
          ssh -T -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              ${{ secrets.HOME_SERVER_USER }}@${{ secrets.HOME_SERVER_VPN_IP }} << 'EOF'
            set -e
            
            echo "🔄 Переходим в директорию проекта..."
            cd ${{ secrets.PROJECT_PATH }}
            
            echo "🔄 Проверяем наличие .env файла..."
            if [ -f .env ]; then
              echo "✅ .env файл уже существует, пропускаем создание"
            else
              echo "📝 Создаем .env файл с секретами..."
              cat > .env << 'ENV_EOF'
              NODE_ENV=production
              PORT=${{ secrets.PORT }}
              DATABASE_URL=${{ secrets.DATABASE_URL }}
              POSTGRES_DB=${{ secrets.POSTGRES_DB }}
              POSTGRES_USER=${{ secrets.POSTGRES_USER }}
              POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
              TELEGRAM_WEBHOOK_URL=${{ secrets.TELEGRAM_WEBHOOK_URL }}
              REDIS_URL=${{ secrets.REDIS_URL }}
              GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
              PROMETHEUS_PASSWORD=${{ secrets.PROMETHEUS_PASSWORD }}
              LOG_LEVEL=${{ secrets.LOG_LEVEL }}
              ENV_EOF
              echo "✅ .env файл создан"
            fi
            
            echo "🚀 Запускаем скрипт деплоя..."
            ./scripts/deploy.sh production
            
            echo "✅ Деплой завершен успешно!"
          EOF

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Деплой успешно завершен!"
            echo "Версия: ${{ github.sha }}"
            echo "Время: $(date)"
          else
            echo "❌ Деплой завершился с ошибкой!"
            echo "Версия: ${{ github.sha }}"
            echo "Время: $(date)"
          fi
