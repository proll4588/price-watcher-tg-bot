name: CI/CD Pipeline

on:
  push:
    tags: ["v*.*.*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add jump server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Добавляем ключи хостов с обработкой ошибок
          ssh-keyscan -H ${{ secrets.JUMP_SERVER_HOST }} >> ~/.ssh/known_hosts || echo "Warning: Could not scan jump server"
          ssh-keyscan -H ${{ secrets.HOME_SERVER_IP }} >> ~/.ssh/known_hosts || echo "Warning: Could not scan home server"

          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection step by step
        run: |
          echo "🔍 Тестируем подключение пошагово..."

          echo "1️⃣ Тестируем подключение к jump server..."
          ssh -T -o ConnectTimeout=10 -o BatchMode=yes ${{ secrets.JUMP_SERVER_USER }}@${{ secrets.JUMP_SERVER_HOST }} "echo '✅ Подключение к jump server успешно'" || {
            echo "❌ Не удалось подключиться к jump server"
            exit 1
          }

          echo "2️⃣ Тестируем подключение к home server через jump server..."

          # Сначала проверим, может ли jump server подключиться к home server напрямую
          echo "🔍 Проверяем подключение jump server → home server..."
          ssh -T -o ConnectTimeout=10 -o BatchMode=yes ${{ secrets.JUMP_SERVER_USER }}@${{ secrets.JUMP_SERVER_HOST }} "ssh -T -o ConnectTimeout=10 -o BatchMode=yes -i ~/.ssh/home_server_key ${{ secrets.HOME_SERVER_USER }}@${{ secrets.HOME_SERVER_IP }} 'echo \"Jump server может подключиться к home server\"'" || {
            echo "❌ Jump server не может подключиться к home server"
            echo "🔍 Проверьте на jump server:"
            echo "   - ssh -i ~/.ssh/home_server_key ${{ secrets.HOME_SERVER_USER }}@${{ secrets.HOME_SERVER_IP }}"
            echo "   - ls -la ~/.ssh/home_server_key*"
            echo "   - cat ~/.ssh/home_server_key.pub"
            echo "🔍 Проверьте на home server:"
            echo "   - grep 'ssh-rsa' ~/.ssh/authorized_keys"
            echo "   - chmod 600 ~/.ssh/authorized_keys"
            exit 1
          }

          # Теперь тестируем через ProxyJump с явным указанием SSH ключа
          ssh -T -o ConnectTimeout=10 -o BatchMode=yes -i ~/.ssh/id_rsa -J ${{ secrets.JUMP_SERVER_USER }}@${{ secrets.JUMP_SERVER_HOST }} ${{ secrets.HOME_SERVER_USER }}@${{ secrets.HOME_SERVER_IP }} "echo '✅ Подключение к home server успешно'" || {
            echo "❌ Не удалось подключиться к home server через jump server"
            echo "🔍 Возможные причины:"
            echo "   - SSH ключ jump server не добавлен в authorized_keys на home server"
            echo "   - Неправильные права доступа на SSH ключи"
            echo "   - Проблемы с сетевым подключением"
            echo "🔍 Проверьте на home server:"
            echo "   - grep 'ssh-rsa' ~/.ssh/authorized_keys"
            echo "   - chmod 600 ~/.ssh/authorized_keys"
            exit 1
          }

          echo "✅ Все подключения работают!"

      - name: Deploy to home server
        run: |
          echo "🚀 Подключаемся к домашнему серверу через jump server и запускаем деплой..."

          # Подключаемся к домашнему серверу через jump server и запускаем скрипт деплоя
          ssh -T -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -i ~/.ssh/id_rsa \
              -J ${{ secrets.JUMP_SERVER_USER }}@${{ secrets.JUMP_SERVER_HOST }} \
              ${{ secrets.HOME_SERVER_USER }}@${{ secrets.HOME_SERVER_IP }} << 'EOF'
            set -e
            
            echo "🔄 Переходим в директорию проекта..."
            cd ${{ secrets.PROJECT_PATH }}
            
            echo "🔄 Проверяем наличие .env файла..."
            if [ -f .env ]; then
              echo "✅ .env файл уже существует, пропускаем создание"
            else
              echo "📝 Создаем .env файл с секретами..."
              cat > .env << 'ENV_EOF'
              NODE_ENV=production
              PORT=${{ secrets.PORT }}
              DATABASE_URL=${{ secrets.DATABASE_URL }}
              POSTGRES_DB=${{ secrets.POSTGRES_DB }}
              POSTGRES_USER=${{ secrets.POSTGRES_USER }}
              POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
              TELEGRAM_WEBHOOK_URL=${{ secrets.TELEGRAM_WEBHOOK_URL }}
              REDIS_URL=${{ secrets.REDIS_URL }}
              GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
              PROMETHEUS_PASSWORD=${{ secrets.PROMETHEUS_PASSWORD }}
              LOG_LEVEL=${{ secrets.LOG_LEVEL }}
              ENV_EOF
              echo "✅ .env файл создан"
            fi
            
            echo "🚀 Запускаем скрипт деплоя..."
            ./scripts/deploy.sh production
            
            echo "✅ Деплой завершен успешно!"
          EOF

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Деплой успешно завершен!"
            echo "Версия: ${{ github.sha }}"
            echo "Время: $(date)"
          else
            echo "❌ Деплой завершился с ошибкой!"
            echo "Версия: ${{ github.sha }}"
            echo "Время: $(date)"
          fi
