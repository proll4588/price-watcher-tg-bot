name: CI/CD Pipeline

on:
  push:
    tags: ["v*.*.*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup WireGuard VPN
        run: |
          echo "🔧 Настраиваем WireGuard VPN..."

          # Устанавливаем WireGuard с sudo
          sudo apt-get update && sudo apt-get install -y wireguard wireguard-tools

          # Создаем конфигурацию WireGuard
          sudo mkdir -p /etc/wireguard
          sudo tee /etc/wireguard/wg0.conf > /dev/null << 'EOF'
          ${{ secrets.WIREGUARD_CONFIG }}
          EOF

          # Устанавливаем правильные права
          sudo chmod 600 /etc/wireguard/wg0.conf

          # Запускаем VPN
          echo "🚀 Запускаем WireGuard VPN..."
          sudo wg-quick up wg0

          # Ждем установки соединения
          echo "⏳ Ждем установки VPN соединения..."
          sleep 10

          # Проверяем статус VPN
          echo "🔍 Проверяем статус WireGuard:"
          sudo wg show

          # Проверяем маршрутизацию
          echo "🔍 Проверяем маршрутизацию:"
          ip route show

      - name: Setup SSH for VPN
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to home server
        run: |
          echo "🚀 Подключаемся к домашнему серверу через VPN и запускаем деплой..."

          # Подключаемся к домашнему серверу через VPN и запускаем скрипт деплоя
          ssh -T -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              ${{ secrets.HOME_SERVER_USER }}@${{ secrets.HOME_SERVER_VPN_IP }} << 'EOF'
            set -e
            
            echo "🔄 Переходим в директорию проекта..."
            cd ${{ secrets.PROJECT_PATH }}
            
            echo "🔄 Проверяем наличие .env файла..."
            if [ ! -f .env ]; then
              echo "❌ .env файл не найден!"
              echo "🔍 Создайте .env файл на сервере перед деплоем"
              echo "📝 Используйте: cp env.example .env && nano .env"
              exit 1
            fi
            
            echo "✅ .env файл найден, продолжаем деплой"
            echo "🚀 Запускаем скрипт деплоя..."
            sudo ./scripts/deploy.sh production
            
            echo "✅ Деплой завершен успешно!"
          EOF

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Деплой успешно завершен!"
            echo "Версия: ${{ github.sha }}"
            echo "Время: $(date)"
          else
            echo "❌ Деплой завершился с ошибкой!"
            echo "Версия: ${{ github.sha }}"
            echo "Время: $(date)"
          fi
